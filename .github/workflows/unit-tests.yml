name: Unit Tests

on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/unit-tests.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/unit-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # bonsai builds from source when no wheel matches; it needs the OpenLDAP headers
      - name: Install OpenLDAP build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libldap2-dev libsasl2-dev

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest server/tests -v
