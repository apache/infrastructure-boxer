name: Web UI Build

on:
  push:
    paths:
      - "webui/**"
      - ".github/workflows/webui-build.yml"
  pull_request:
    paths:
      - "webui/**"
      - ".github/workflows/webui-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Fail if dist/ is out of date
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::webui/dist is out of date - run 'npm run build' in webui/ and commit the result."
            git diff --stat -- dist
            exit 1
          fi
