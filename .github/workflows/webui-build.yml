name: Web UI Build

on:
  push:
    paths:
      - "webui/**"
      - ".github/workflows/webui-build.yml"
  pull_request:
    paths:
      - "webui/**"
      - ".github/workflows/webui-build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit updated dist/
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- dist && [ -z "$(git ls-files --others --exclude-standard -- dist)" ]; then
            echo "webui/dist is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- dist
          git commit -m "boxer chore: rebuild webui/dist/ [skip ci]"
          git push origin HEAD:"${GITHUB_REF_NAME}"
